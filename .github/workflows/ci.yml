name: Node.js CI

on:
  push:
    branches: [ github-action ]
  pull_request:
    branches: [ github-action ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/node-js-sample:latest

    - name: Run tests inside Docker container
      run: |
        docker run --rm ${{ secrets.DOCKER_USERNAME }}/node-js-sample:latest npm test

    - name: Lint code inside Docker container
      run: |
        docker run --rm ${{ secrets.DOCKER_USERNAME }}/node-js-sample:latest npm run lint