name: Node.js CI

on:
  push:
    branches: [ github-action ]
  pull_request:
    branches: [ github-action ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: ${{ secrets.DOCKER_USERNAME }}/node-js-sample:latest

    - name: Run Docker container
      run: |
        docker run -d --name node-js-sample -p 3000:8080 ${{ secrets.DOCKER_USERNAME }}/node-js-sample:latest
        sleep 10 # Wait for the container to be fully up and running

    - name: Test application with curl
      run: |
        curl --fail http://localhost:3000 || (docker logs node-js-sample && exit 1)

    - name: Push Docker image
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/node-js-sample:latest

    - name: Clean up
      run: |
        docker stop node-js-sample
        docker rm node-js-sample